# Enterprise Suite — one-container pilot deployment.
#
#   docker compose up --build
#
# Surfaces once healthy:
#   http://localhost:4000   suite shell (process table + readiness)
#   http://localhost:4100   API gateway (/health, /health/ready, /openapi.json)
#   http://localhost:4119   admin console
#   http://localhost:4300   web portal
#
# Smoke-test from the host:  npm run suite:smoke
services:
  suite:
    build: .
    container_name: enterprise-suite
    ports:
      - "4000:4000"   # suite shell
      - "4100:4100"   # api gateway
      - "4119:4119"   # admin console
      - "4300:4300"   # web portal
    environment:
      SEED: "1"                  # seed the "demo" tenant on boot
      SUITE_BIND_HOST: 0.0.0.0   # shell must bind all interfaces in a container
      SUITE_READY_TIMEOUT_MS: "180000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/status').then(r=>r.json()).then(s=>process.exit(s.ready?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped
