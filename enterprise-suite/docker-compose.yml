services:
  suite:
    build: .
    ports:
      - "4000:4000"
      - "4100:4100"
      - "4119:4119"
      - "4300:4300"
    environment:
      ASSUME_DEPLOYED: "true"
      SUITE_TRUST_HEADERS: "true"
      SUITE_AUTH_SECRET: local-demo-only-suite-auth-secret
      PORTAL_TRANSPORT: http
      PORTAL_GATEWAY_URL: http://127.0.0.1:4100
      PORTAL_DEFAULT_TENANT: demo
      SEED: "1"
    # Suite binds many loopback ports inside the container; host maps the UX surfaces.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
